{% extends "base.html" %}
{% block title %}Admin-Login{% endblock %}

{% block content %}
<section class="ar-container" style="padding: var(--ar-space-16) 0; display:flex; justify-content:center;">
  <div style="width:100%; max-width:420px;">
    <div class="ar-card" style="padding: var(--ar-space-8);">
      <span class="ar-eyebrow">// Admin</span>
      <h1 class="ar-display-s" style="margin-top: var(--ar-space-2);">Anmelden</h1>
      {% if error %}
      <p class="ar-small" style="color:var(--ar-coral); margin-top: var(--ar-space-3);">{{ error }}</p>
      {% endif %}
      <form method="post" action="/login" style="margin-top: var(--ar-space-6);">
        <div class="ar-field">
          <label class="ar-eyebrow" for="password">Passwort</label>
          <input type="password" id="password" name="password" required autofocus>
        </div>
        <button type="submit" class="ar-btn ar-btn-coral" style="width:100%; margin-top: var(--ar-space-5);">
          Anmelden
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
