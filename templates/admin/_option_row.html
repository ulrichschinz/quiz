{# One answer-option row. Rendered inline AND returned as the inline-save
   fragment (replace target = the wrapping [data-replace]/[data-card]). Field
   names mirror the update_option route. Layout = a friendly horizontal row. #}
<div class="opt-row" data-card data-replace>
  <form method="post" action="/admin/options/{{ o.id }}" data-inline>
    <input type="hidden" name="quiz_id" value="{{ quiz.id }}">
    <input type="hidden" name="position" value="{{ o.position }}">
    <div class="opt-grid">
      <div class="ar-field"><label>Antwort (Deutsch)</label><input name="label_de" value="{{ o.label_de }}"></div>
      <div class="ar-field"><label>Antwort (Englisch)</label><input name="label_en" value="{{ o.label_en }}"></div>
      <div class="ar-field opt-weight"><label>Gewicht</label><input name="weight" inputmode="decimal" value="{{ o.weight }}"></div>
      <div class="opt-actions">
        <button class="ar-btn ar-btn-primary">OK</button>
        <button formaction="/admin/options/{{ o.id }}/delete" data-mode="remove" class="ar-btn ar-btn-ghost" aria-label="Antwort löschen">✕</button>
      </div>
    </div>
  </form>
</div>
