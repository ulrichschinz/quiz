<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Agentic AI Readiness{% endblock %} · Agentic Reach</title>
  <link rel="icon" href="/static/brand/logos/mark-color.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/brand/brand-kit.css">
  <link rel="stylesheet" href="/static/quiz/quiz.css">
  {% block head_extra %}{% endblock %}
</head>
<body data-lang="{{ lang|default('de') }}">

<nav class="ar-nav">
  <div class="ar-nav-row ar-container">
    <a href="/" class="ar-nav-brand">
      <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true">
        <g stroke="#3D2B5C" stroke-width="1.4" fill="none" opacity="0.55">
          <line x1="32" y1="14" x2="47.59" y2="23"/>
          <line x1="47.59" y1="23" x2="47.59" y2="41"/>
          <line x1="47.59" y1="41" x2="32" y2="50"/>
          <line x1="32" y1="50" x2="16.41" y2="41"/>
          <line x1="16.41" y1="41" x2="16.41" y2="23"/>
          <line x1="16.41" y1="23" x2="32" y2="14"/>
          <line x1="32" y1="32" x2="32" y2="14"/>
          <line x1="32" y1="32" x2="47.59" y2="23"/>
          <line x1="32" y1="32" x2="47.59" y2="41"/>
          <line x1="32" y1="32" x2="32" y2="50"/>
          <line x1="32" y1="32" x2="16.41" y2="41"/>
          <line x1="32" y1="32" x2="16.41" y2="23"/>
        </g>
        <circle cx="32" cy="32" r="3.6" fill="#3D2B5C"/>
        <circle cx="47.59" cy="23" r="2.8" fill="#3D2B5C"/>
        <circle cx="47.59" cy="41" r="2.8" fill="#3D2B5C"/>
        <circle cx="32" cy="50" r="2.8" fill="#3D2B5C"/>
        <circle cx="16.41" cy="41" r="2.8" fill="#3D2B5C"/>
        <circle cx="16.41" cy="23" r="2.8" fill="#3D2B5C"/>
        <circle cx="32" cy="14" r="4.4" fill="#FF7A6B"/>
        <circle cx="51.59" cy="19" r="2" fill="#F4C84A"/>
      </svg>
      <span>Agentic Reach</span>
    </a>
    <div class="ar-nav-right">
      {% block lang_toggle %}
      <div class="ar-lang-toggle">
        <button type="button" data-lang-btn="de">DE</button>
        <button type="button" data-lang-btn="en">EN</button>
      </div>
      {% endblock %}
      {% block nav_cta %}{% endblock %}
    </div>
  </div>
</nav>

<main class="ar-main">
  {% block content %}{% endblock %}
</main>

<footer class="ar-footer">
  <div class="ar-container">
    <p class="ar-footer-claim"
       data-de="Bereit für das <em>agentische</em> Zeitalter?"
       data-en="Ready for the <em>agentic</em> era?">Bereit für das <em>agentische</em> Zeitalter?</p>
    <div class="ar-footer-meta">
      <span class="ar-mono">// Agentic Reach</span>
      <span class="ar-mono">© 2026 · for what's next</span>
    </div>
  </div>
</footer>

<script defer src="/static/brand/components.js"></script>
<!-- Unified DE/EN toggle: every [data-de]/[data-en] element swaps innerHTML,
     the active lang button is marked, and a 'langchange' event lets the quiz
     player re-render its dynamic questions. -->
<script>
  (function () {
    function setLang(lang) {
      if (lang !== 'de' && lang !== 'en') lang = 'de';
      document.body.dataset.lang = lang;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-' + lang + ']').forEach(function (el) {
        var v = el.getAttribute('data-' + lang);
        if (v != null) el.innerHTML = v;
      });
      document.querySelectorAll('[data-lang-btn]').forEach(function (b) {
        b.classList.toggle('active', b.dataset.langBtn === lang);
      });
      window.dispatchEvent(new CustomEvent('langchange', { detail: { lang: lang } }));
    }
    window.ARQuizLang = { set: setLang, get: function () { return document.body.dataset.lang || 'de'; } };
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('[data-lang-btn]').forEach(function (b) {
        b.addEventListener('click', function () { setLang(b.dataset.langBtn); });
      });
      setLang(document.body.dataset.lang || 'de');
    });
  })();
</script>
{% block body_scripts %}{% endblock %}
</body>
</html>
