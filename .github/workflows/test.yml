name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Pip cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'requirements.lock') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      # SEC-012/SEC-019: fail on any known advisory in what the image ships
      # (requirements.lock = requirements.txt + all transitive pins, hashed).
      - name: Dependency audit
        run: make PY=python audit

      # THE gate: lint + format-check + mypy + import-contracts + test-fast + doc-gate.
      # CI uses the runner's system Python (no .venv), hence the PY/LINT_IMPORTS overrides.
      - name: Verify
        run: make PY=python LINT_IMPORTS=lint-imports verify

      # Scaffold-Vertrag: a freshly scaffolded domain passes the tool gate with
      # zero manual edits (and the independence contract is auto-patched).
      - name: Scaffold smoke
        run: |
          python scripts/new_quiz_module.py scaffoldsmoke
          grep -q '"app.domains.scaffoldsmoke"' pyproject.toml
          make PY=python LINT_IMPORTS=lint-imports lint format-check typecheck contracts
          python -m pytest tests/unit/test_scaffoldsmoke.py -q
          rm -rf app/domains/scaffoldsmoke tests/unit/test_scaffoldsmoke.py scaffold.db
          git checkout -- app pyproject.toml 2>/dev/null || true

      - name: E2E tests
        run: make PY=python test-e2e
