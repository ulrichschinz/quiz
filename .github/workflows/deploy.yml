name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  SERVICE_NAME: quiz

jobs:
  # Pre-deploy gate: the stdlib-only contract self-check (no app deps, ~2s).
  # The PR is the full test gate by convention (test.yml does not run on main).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract self-check (ARCHITECTURE.md ↔ code)
        run: python3 scripts/check_contract.py

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: echo "deploy triggered"
          # The server uses an SSH forced command (authorized_keys command="…");
          # the script above is ignored. The deploy key's forced command runs
          #   sudo /opt/scripts/deploy.sh quiz
          # on adm.agentic-reach.com, which does `docker compose pull && up -d
          # --remove-orphans` in /opt/services/quiz (per the srvmgmt convention).
