name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  SERVICE_NAME: quiz

# Third-party actions are pinned to full commit SHAs (SEC-019): a moved tag
# cannot swap the code that sees DEPLOY_SSH_KEY / packages:write. Dependabot
# (.github/dependabot.yml) proposes SHA bumps; keep the "# vX.Y.Z" comments.
jobs:
  # Pre-deploy gate (SEC-019): the full acceptance gate on exactly the commit
  # that gets built — not only on the PR that preceded it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install deps (hash-pinned runtime + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      - name: Dependency audit (known advisories)
        run: make PY=python audit
      - name: Verify (lint + format + mypy + contracts + test-fast + doc-gate)
        run: make PY=python LINT_IMPORTS=lint-imports verify
      - name: E2E tests
        run: make PY=python test-e2e

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: echo "deploy triggered"
          # The server uses an SSH forced command (authorized_keys command="…");
          # the script above is ignored. The deploy key's forced command runs
          #   sudo /opt/scripts/deploy.sh quiz
          # on adm.agentic-reach.com, which does `docker compose pull && up -d
          # --remove-orphans` in /opt/services/quiz (per the srvmgmt convention).
