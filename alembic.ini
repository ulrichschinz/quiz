# Alembic config — manual CLI use only.
#
# In production the schema is migrated IN-PROCESS by
# `app.core.db_migrate.run_migrations` (called from `app.core.db.create_db`),
# which builds its Config programmatically and binds Alembic to the live
# engine — this file is NOT read on that path.
#
# The database URL is intentionally NOT set here: env.py falls back to the
# central `app.core.config` settings when no live connection was stashed, so
# there is exactly one source of the URL.
#
# Usage:
#   alembic -c alembic.ini upgrade head
#   alembic -c alembic.ini revision -m "add X"

[alembic]
script_location = migrations
version_table = alembic_version

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
